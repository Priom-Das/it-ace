# Professional pubspec configuration for cse_it_prep_app
name: cse_it_prep_app
description: "A new Flutter project for CSE IT Job Preparation."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Cupertino Icons
  cupertino_icons: ^1.0.8

  # Supabase Integration
  supabase_flutter: ^2.8.0

  # PDF & Video Viewers
  flutter_pdfview: ^1.4.5
  video_player: ^2.8.2
  chewie: ^1.8.1

  # Utilities
  path_provider: ^2.1.6
  http: ^1.2.0
  youtube_player_flutter: ^9.1.3
  dio: ^5.4.0
  permission_handler: ^11.3.0
  youtube_player_iframe: ^5.2.1
  file_picker: ^8.1.2
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true