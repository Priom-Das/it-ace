name: cse_it_prep_app
description: "A new Flutter project for CSE IT Job Preparation."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_dotenv: ^5.1.0

  # Cupertino Icons
  cupertino_icons: ^1.0.8

  # Supabase Integration
  supabase_flutter: ^2.8.0

  # PDF & Video Viewers
  flutter_pdfview: ^1.4.5
  video_player: ^2.8.2
  chewie: ^1.8.1

  # Utilities & Storage
  path_provider: ^2.1.6
  http: ^1.2.0
  youtube_player_flutter: ^10.0.1
  dio: ^5.4.0
  permission_handler: ^13.0.2
  youtube_player_iframe: ^6.0.2
  file_picker: ^8.3.3
  url_launcher: ^6.3.0

  # AI Assistant Required Packages
  shared_preferences: ^2.3.2
  flutter_markdown: ^0.7.3
  speech_to_text: ^7.5.0
  share_plus: ^10.1.4
  image_picker: ^1.1.2
  flutter_math_fork: ^0.7.2
  pointer_interceptor: ^0.10.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true